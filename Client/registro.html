<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="CSS/login.css">
    <title>Registro de cuenta</title>
</head>
<body>
    <style>
        body {
        background-image: url('Imagenes/Fondos/pared\ negra.jpg');
        font-family: "Oswald", sans-serif;
        }
      </style>
    <div class="img-container">
        <img src="Imagenes/nombre-removebg-preview.png" alt="Logo">
    </div>
    <div class="form-container">
        <h1>Registro</h1>
<form id="registerForm">
  <div class="mb-3">
    <label for="usuario" class="form-label">Nombre de usuario</label>
    <input id="txtUsername" name="txtUsername" class="form-control" type="text" placeholder="Nombre de usuario" required>
  </div>
  <div class="mb-3">
    <label for="fLPassword" class="form-label">Contraseña</label>
    <input id="txtLPassword" class="form-control" name="txtLPassword" type="password" placeholder="Contraseña" required>
  </div>
  <div class="d-grid">
    <button type="submit" class="btn btn-primary">Crear cuenta</button>
  </div>
</form>

<div class="mt-3">
  <p>¿Ya tienes una cuenta? <a href="login.html">Iniciar sesión</a></p>
</div>

    </div>

    <script>
    document.getElementById('registerForm').addEventListener('submit', async function (e) {
    e.preventDefault(); // prevent page reload

    const username = document.getElementById('txtUsername').value;
    const password = document.getElementById('txtLPassword').value;

    const res = await fetch('/api/register', {
    method: 'POST',
    headers: {
    'Content-Type': 'application/json'
    },
    body: JSON.stringify({ username, password })
    });

    const data = await res.json();
    if (data.success) {
    alert('¡Cuenta creada con éxito!');
    window.location.href = 'login.html';
    } else {
    alert('Error al crear la cuenta: ' + data.error);
    }
    });
    </script>


    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js"></script>

</body>
</html>
