<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prueba Facebook Posts</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background-color: #111; color: white;">
  <div class="container mt-5">
    <h1 class="mb-4">Últimas publicaciones</h1>
    <div id="postsContainer" class="row"></div>
  </div>

  <!-- Modal -->
  <div class="modal fade" id="postModal" tabindex="-1" aria-labelledby="postModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="postModalLabel">Publicación</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <img id="modalImage" src="" alt="Imagen" class="img-fluid mb-3">
          <p id="modalMessage"></p>
        </div>
        <div class="modal-footer">
          <p id="modalDate" class="me-auto mb-0"></p>
          <a id="modalLink" href="#" target="_blank" class="btn btn-primary">Ver en Facebook</a>
        </div>
      </div>
    </div>
  </div>

  <!-- SDK -->
  <script async defer crossorigin="anonymous" src="https://connect.facebook.net/en_US/sdk.js"></script>

  <script>
    // 🔧 CONFIGURA ESTOS DATOS:
    const pageId = "618787511306843"; // Facebook Página pública de prueba: Facebook App
    const accessToken = "EAAI1wv33WSoBOZCv0pBZCbQenMo4thxDAKrZCui2fZAjV51LMC0X8Ht7kZBx8QUrjxCMwg0aNlusNUoJ1jdm8fs6WQziZAIVMPy1WP8TuzKqXMZAvUyl0EySwg9oBPH70vqJFh26qUZCDMfwn29q3qc4H9uYa2YkFmdSbWR6eyHPhk1X2HHIMMLia1kk8pgiPnIz5zDjYl8gvvOaHqm0AT3Sm6j5kGCh"; // Usa uno válido desde Graph API Explorer

    window.fbAsyncInit = function () {
      FB.init({
        appId: '622061554194730', // Puedes dejar cualquier appId si solo usas token
        xfbml: false,
        version: 'v17.0'
      });

      console.log("Facebook SDK cargado");
      cargarPosts();
    };

    function cargarPosts() {
      FB.api(`/${pageId}/posts?fields=message,created_time,full_picture,permalink_url`, {
        access_token: accessToken
      }, function (response) {
        console.log("Respuesta de la API:", response);

        const container = document.getElementById("postsContainer");
        container.innerHTML = "";

        if (response && response.data && response.data.length > 0) {
          response.data.slice(0, 3).forEach(post => {
            const imgSrc = post.full_picture || "https://via.placeholder.com/600x400?text=Sin+imagen";
            const message = post.message || "Sin contenido";
            const postDate = new Date(post.created_time).toLocaleString();

            const col = document.createElement("div");
            col.className = "col-md-4 mb-3";

            const card = document.createElement("div");
            card.className = "card h-100";
            card.style.cursor = "pointer";
            card.onclick = () => {
              document.getElementById('modalImage').src = imgSrc;
              document.getElementById('modalMessage').textContent = message;
              document.getElementById('modalDate').textContent = `Publicado: ${postDate}`;
              document.getElementById('modalLink').href = post.permalink_url || "#";
              const modal = new bootstrap.Modal(document.getElementById('postModal'));
              modal.show();
            };

            card.innerHTML = `
              <img src="${imgSrc}" class="card-img-top" alt="Imagen">
              <div class="card-body">
                <p class="card-text">${message}</p>
              </div>
            `;

            col.appendChild(card);
            container.appendChild(col);
          });
        } else {
          container.innerHTML = '<p>No se encontraron publicaciones.</p>';
        }
      });
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
